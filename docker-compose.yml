name: secscan
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: secscan-frontend
    depends_on:
      - backend
    networks:
      - proxy
      - internal
    expose:
      - "80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secscan-backend
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - MCP_SERVER_URL=http://mcp-server-disabled:8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ALLOWED_ORIGINS=["https://secscan.104-105-82-181.sslip.io"]
      - DATABASE_URL=postgresql://security_user:${DB_PASSWORD}@postgres:5432/security_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - proxy
      - internal
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  postgres:
    image: postgres:15-alpine
    container_name: secscan-postgres
    environment:
      - POSTGRES_DB=security_db
      - POSTGRES_USER=security_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: secscan-redis
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped

networks:
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data: